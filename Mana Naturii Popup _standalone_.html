-mn-sans);\n    color: var(--mn-ink);\n    -webkit-font-smoothing: antialiased;\n  }\n  .mn-overlay.on{ opacity: 1; pointer-events: auto; }\n\n  .mn-popup{\n    width: min(880px, 100%);\n    background: var(--mn-card);\n    border-radius: 24px;\n    overflow: hidden;\n    box-shadow:\n      0 32px 80px -16px rgba(0,40,20,.5),\n      0 16px 36px -16px rgba(0,40,20,.35);\n    display: grid;\n    grid-template-columns: 0.85fr 1fr;\n    transform: scale(.96) translateY(20px);\n    transition: transform .4s cubic-bezier(.16,1,.3,1);\n    position: relative;\n  }\n  .mn-overlay.on .mn-popup{ transform: scale(1) translateY(0); }\n\n  /* Left visual side */\n  .mn-pop-l{\n    position: relative;\n    background: linear-gradient(165deg, #073A1F 0%, #0C542F 60%, #073A1F 100%);\n    color: var(--mn-paper);\n    padding: 36px 36px 32px;\n    display: flex; flex-direction: column;\n    gap: 22px;\n    overflow: hidden;\n    min-height: 540px;\n  }\n  .mn-pop-l::before{\n    content: \"\"; position: absolute; inset: 0;\n    background:\n      radial-gradient(60% 50% at 100% 100%, color-mix(in srgb, var(--mn-lime) 22%, transparent), transparent 60%),\n      radial-gradient(40% 30% at 0% 0%, color-mix(in srgb, var(--mn-gold) 22%, transparent), transparent 60%);\n    pointer-events: none;\n  }\n  .mn-pop-l > *{ position: relative; }\n\n  .mn-pop-brand{ display: flex; align-items: center; margin-bottom: 4px; }\n  .mn-pop-brand img{\n    height: 38px; width: auto; display: block;\n    filter: brightness(0) invert(1);\n    opacity: .95;\n  }\n\n  .mn-pop-tag{\n    display: inline-flex; gap: 10px; align-items: center;\n    padding: 6px 14px 6px 6px;\n    background: color-mix(in srgb, var(--mn-gold) 18%, transparent);\n    border: 1px solid color-mix(in srgb, var(--mn-gold) 40%, transparent);\n    border-radius: 999px;\n    font-size: 11px; font-family: var(--mn-mono); letter-spacing: 0.08em;\n    text-transform: uppercase; font-weight: 600;\n    width: fit-content;\n    color: var(--mn-gold-soft);\n  }\n  .mn-pop-tag .pip{\n    width: 22px; height: 22px; border-radius: 50%;\n    background: var(--mn-gold); color: var(--mn-primary-3);\n    display: grid; place-items: center; font-size: 11px; font-weight: 700;\n    font-family: var(--mn-sans);\n  }\n\n  .mn-pop-deal{\n    position: relative;\n    padding: 4px 0 22px;\n    border-bottom: 1px dashed color-mix(in srgb, var(--mn-paper) 22%, transparent);\n  }\n  .mn-pop-deal .pct{\n    display: block;\n    font-family: var(--mn-serif); font-style: italic; font-weight: 400;\n    font-size: 124px; line-height: .85; letter-spacing: -0.04em;\n    color: var(--mn-gold);\n    text-shadow: 0 6px 24px color-mix(in srgb, var(--mn-gold) 25%, transparent);\n  }\n  .mn-pop-deal .lbl{\n    display: block; margin-top: 10px;\n    color: var(--mn-paper);\n    font-size: 17px; line-height: 1.35;\n    font-family: var(--mn-serif); font-style: italic;\n    max-width: 22ch;\n  }\n  .mn-pop-deal .micro{\n    display: block; margin-top: 8px;\n    font-family: var(--mn-mono); font-size: 10px;\n    letter-spacing: 0.12em; text-transform: uppercase;\n    color: color-mix(in srgb, var(--mn-paper) 55%, transparent);\n    font-weight: 500;\n  }\n  .mn-pop-deal .micro b{ color: var(--mn-gold-soft); font-weight: 600; }\n\n  .mn-pop-gift{\n    display: grid; grid-template-columns: 46px 1fr;\n    gap: 14px; align-items: center;\n    padding: 14px 16px;\n    background: color-mix(in srgb, var(--mn-paper) 9%, transparent);\n    border: 1px solid color-mix(in srgb, var(--mn-paper) 16%, transparent);\n    border-radius: 12px;\n  }\n  .mn-pop-gift .gift-ico{\n    width: 46px; height: 46px; border-radius: 12px;\n    background: var(--mn-paper);\n    display: grid; place-items: center;\n    flex: none;\n  }\n  .mn-pop-gift .gift-ico svg{ color: var(--mn-primary); }\n  .mn-pop-gift .info{\n    color: color-mix(in srgb, var(--mn-paper) 80%, transparent);\n    font-size: 12.5px; line-height: 1.4;\n  }\n  .mn-pop-gift .info b{\n    color: var(--mn-paper); font-weight: 600;\n    display: block; font-size: 14px; margin-bottom: 2px;\n    letter-spacing: -0.005em;\n  }\n  .mn-pop-gift .info .meta{\n    margin-top: 4px; display: block;\n    font-family: var(--mn-mono); font-size: 10px;\n    letter-spacing: 0.06em; text-transform: uppercase;\n    color: color-mix(in srgb, var(--mn-paper) 55%, transparent);\n  }\n\n  .mn-pop-trust{\n    margin-top: auto;\n    padding-top: 18px;\n    border-top: 1px solid color-mix(in srgb, var(--mn-paper) 14%, transparent);\n    color: color-mix(in srgb, var(--mn-paper) 70%, transparent);\n    font-size: 12.5px;\n    display: flex; gap: 12px; align-items: center;\n  }\n  .mn-pop-trust .stack{ display: flex; }\n  .mn-pop-trust .av{\n    width: 28px; height: 28px; border-radius: 50%;\n    border: 2px solid var(--mn-primary);\n    margin-left: -8px;\n    display: grid; place-items: center;\n    font-size: 10px; font-weight: 600;\n    color: var(--mn-primary-3);\n  }\n  .mn-pop-trust .av:first-child{ margin-left: 0; }\n  .mn-pop-trust .av.a1{ background: var(--mn-pale-green); }\n  .mn-pop-trust .av.a2{ background: var(--mn-gold-soft); }\n  .mn-pop-trust .av.a3{ background: var(--mn-lime); }\n  .mn-pop-trust b{ color: var(--mn-paper); font-weight: 600; }\n\n  /* Right form side */\n  .mn-pop-r{\n    padding: 40px 40px 32px;\n    display: flex; flex-direction: column;\n    position: relative;\n  }\n  .mn-pop-close{\n    position: absolute;\n    top: 16px; right: 16px;\n    width: 34px; height: 34px;\n    border: 0;\n    border-radius: 50%;\n    background: var(--mn-paper);\n    color: var(--mn-ink-mute);\n    display: grid; place-items: center;\n    cursor: pointer;\n    transition: background .15s, color .15s, transform .1s;\n    z-index: 2;\n  }\n  .mn-pop-close:hover{ background: var(--mn-paper-2); color: var(--mn-ink); transform: rotate(90deg); }\n\n  .mn-pop-eyebrow{\n    font-family: var(--mn-mono); font-size: 11px;\n    letter-spacing: 0.14em; text-transform: uppercase;\n    color: var(--mn-primary); font-weight: 500;\n    margin-bottom: 12px;\n  }\n  .mn-pop-r h2{\n    font-family: var(--mn-sans);\n    font-size: 30px; line-height: 1.06;\n    letter-spacing: -0.025em; font-weight: 600;\n    margin: 0 0 12px;\n    color: var(--mn-ink);\n  }\n  .mn-pop-r h2 .serif{\n    font-family: var(--mn-serif); font-style: italic; font-weight: 400;\n    color: var(--mn-primary);\n  }\n  .mn-pop-r .lede{\n    color: var(--mn-ink-soft); font-size: 14.5px;\n    line-height: 1.5; margin: 0 0 18px;\n    max-width: 38ch;\n  }\n\n  .mn-pop-perks{\n    display: grid; gap: 8px;\n    margin-bottom: 22px;\n    padding: 14px 16px;\n    background: var(--mn-paper-2);\n    border-radius: 12px;\n    font-size: 13px;\n  }\n  .mn-pop-perks .p{\n    display: grid; grid-template-columns: 16px 1fr;\n    gap: 10px; align-items: center;\n    color: var(--mn-ink-soft);\n  }\n  .mn-pop-perks .p svg{ color: var(--mn-primary); flex: none; }\n  .mn-pop-perks .p b{ color: var(--mn-ink); font-weight: 600; }\n\n  .mn-pop-fields{ display: grid; gap: 10px; }\n  .mn-pop-field{ display: grid; gap: 5px; }\n  .mn-pop-field label{\n    font-family: var(--mn-mono); font-size: 10.5px;\n    letter-spacing: 0.08em; text-transform: uppercase;\n    color: var(--mn-ink-mute); font-weight: 500;\n  }\n  .mn-pop-input{\n    display: flex; align-items: center; gap: 10px;\n    background: var(--mn-paper); border: 1px solid var(--mn-line);\n    border-radius: 11px;\n    padding: 0 14px;\n    height: 46px;\n    transition: border-color .15s, box-shadow .15s, background .15s;\n  }\n  .mn-pop-input:focus-within{\n    border-color: var(--mn-primary); background: var(--mn-card);\n    box-shadow: 0 0 0 4px var(--mn-primary-soft);\n  }\n  .mn-pop-input svg{ color: var(--mn-ink-mute); flex: none; }\n  .mn-pop-input input{\n    flex: 1; min-width: 0; border: 0; background: transparent;\n    font-family: var(--mn-sans); font-size: 14.5px; color: var(--mn-ink);\n    font-weight: 500;\n    height: 100%; outline: 0;\n  }\n\n  .mn-pop-submit{\n    margin-top: 14px;\n    width: 100%;\n    padding: 16px;\n    border: 0;\n    border-radius: 11px;\n    background: var(--mn-primary); color: var(--mn-paper);\n    font-family: var(--mn-sans); font-size: 15px; font-weight: 600;\n    display: inline-flex; gap: 10px; justify-content: center; align-items: center;\n    cursor: pointer;\n    transition: background .15s, transform .1s;\n    letter-spacing: -0.005em;\n  }\n  .mn-pop-submit:hover{ background: var(--mn-primary-2); transform: translateY(-1px); }\n\n  .mn-pop-decline{\n    margin-top: 14px;\n    text-align: center;\n    font-family: var(--mn-sans);\n    font-size: 12px;\n    color: var(--mn-ink-mute);\n    background: none; border: 0;\n    cursor: pointer;\n    width: 100%;\n    text-decoration: underline;\n    text-decoration-color: var(--mn-line);\n    text-underline-offset: 4px;\n  }\n  .mn-pop-decline:hover{ color: var(--mn-ink); text-decoration-color: var(--mn-ink-mute); }\n\n  .mn-pop-foot{\n    margin-top: 14px;\n    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;\n    font-size: 11px; color: var(--mn-ink-mute);\n  }\n  .mn-pop-foot .it{ display: inline-flex; gap: 5px; align-items: center; }\n  .mn-pop-foot svg{ color: var(--mn-success); }\n\n  /* ─── Success state ─── */\n  .mn-pop-success{ display: none; text-align: center; padding: 16px 0; }\n  .mn-pop-success.on{ display: block; }\n  .mn-pop-r.success-mode .mn-pop-eyebrow,\n  .mn-pop-r.success-mode h2,\n  .mn-pop-r.success-mode .lede,\n  .mn-pop-r.success-mode .mn-pop-perks,\n  .mn-pop-r.success-mode form,\n  .mn-pop-r.success-mode .mn-pop-decline,\n  .mn-pop-r.success-mode .mn-pop-foot{ display: none; }\n  .mn-pop-success .check-circle{\n    width: 76px; height: 76px; border-radius: 50%;\n    background: color-mix(in srgb, var(--mn-success) 18%, transparent);\n    color: var(--mn-success);\n    display: grid; place-items: center;\n    margin: 0 auto 18px;\n  }\n  .mn-pop-success h2{\n    font-fa șa popup-ul.\n    // Pentru testare locală: localStorage.removeItem('mn_popup_dismissed')\n    try {\n      if (localStorage.getItem(STORAGE_KEY)) return;\n    } catch (e) { /* localStorage indisponibil — continuă oricum */ }\n\n    var overlay     = document.getElementById('mnOverlay');\n    var closeBtn    = document.getElementById('mnCloseBtn');\n    var declineBtn  = document.getElementById('mnDeclineBtn');\n    var form        = document.getElementById('mnPopForm');\n    var popR        = document.getElementById('mnPopR');\n    var popSuccess  = document.getElementById('mnPopSuccess');\n    var popName     = document.getElementById('mnPopName');\n\n    if (!overlay) return;\n\n    function dismiss(){\n      overlay.classList.remove('on');\n      try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}\n    }\n\n    closeBtn.addEventListener('click', dismiss);\n    declineBtn.addEventListener('click', dismiss);\n    overlay.addEventListener('click', function(e){\n      if (e.target === overlay) dismiss();\n    });\n    document.addEventListener('keydown', function(e){\n      if (e.key === 'Escape' && overlay.classList.contains('on')) dismiss();\n    });\n\n    form.addEventListener('submit', function(e){\n      e.preventDefault();\n\n      // ⚠️ Aici trimiți datele către backend / Mailchimp / Klaviyo etc.\n      // Exemplu:\n      // var data = new FormData(form);\n      // fetch('/api/newsletter', { method: 'POST', body: data });\n\n      // Generează cod personalizat după prenume\n      var raw  = (popName.value || 'TU').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 8) || 'PRIETEN';\n      var code = popSuccess.querySelector('.code-value');\n      if (code) code.textContent = 'BINE-10-' + raw;\n\n      popR.classList.add('success-mode');\n      popSuccess.classList.add('on');\n\n      try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}\n    });\n\n    // Apare după DELAY_MS\n    setTimeout(function(){\n      overlay.classList.add('on');\n    }, DELAY_MS);\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
